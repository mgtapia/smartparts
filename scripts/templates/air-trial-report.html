<title>Compra aérea de prueba E70</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
/>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --ink: #1b2130;
    --muted: #5d6779;
    --line: #dde1e8;
    --accent: #2a4bd7;
    --accent-soft: #e6ebfb;
    --unverified: #c8202a;
    --unverified-soft: #fdeceb;
    --good: #1c7a4d;
    --good-soft: #e3f4ea;
    --warn: #a86400;
    --warn-soft: #fdf1dc;
    --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      color-scheme: dark;
      --bg: #12151c;
      --surface: #1a1f2a;
      --ink: #e7eaf1;
      --muted: #a0a9ba;
      --line: #2c3342;
      --accent: #8ea4ff;
      --accent-soft: #232b4a;
      --unverified: #ff7a80;
      --unverified-soft: #3a1c20;
      --good: #63d29b;
      --good-soft: #17301f;
      --warn: #f0b552;
      --warn-soft: #33270f;
    }
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --bg: #12151c;
    --surface: #1a1f2a;
    --ink: #e7eaf1;
    --muted: #a0a9ba;
    --line: #2c3342;
    --accent: #8ea4ff;
    --accent-soft: #232b4a;
    --unverified: #ff7a80;
    --unverified-soft: #3a1c20;
    --good: #63d29b;
    --good-soft: #17301f;
    --warn: #f0b552;
    --warn-soft: #33270f;
  }
  * {
    box-sizing: border-box;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    padding-inline: 16px;
    padding-block: 32px 64px;
  }
  main {
    max-width: 1040px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }
  h1,
  h2,
  h3 {
    text-wrap: balance;
    margin: 0;
    line-height: 1.2;
  }
  h1 {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  h2 {
    font-size: 20px;
    font-weight: 600;
  }
  h3 {
    font-size: 15px;
    font-weight: 600;
  }
  p {
    margin: 0;
    max-width: 68ch;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  header {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .lede {
    color: var(--muted);
    font-size: 16px;
  }
  section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 20px;
  }
  .verdict {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
  }
  .verdict .card {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .big {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .who {
    font-size: 18px;
    font-weight: 600;
  }
  .muted {
    color: var(--muted);
  }
  .red {
    color: var(--unverified);
  }
  .tag {
    display: inline-block;
    font-size: 12px;
    padding: 1px 8px;
    border-radius: 999px;
    font-weight: 500;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .tag.red {
    background: var(--unverified-soft);
    color: var(--unverified);
  }
  .tag.warn {
    background: var(--warn-soft);
    color: var(--warn);
  }
  .tag.good {
    background: var(--good-soft);
    color: var(--good);
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    align-items: center;
  }
  .seg {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .seg button {
    font: inherit;
    font-size: 14px;
    background: var(--surface);
    color: var(--ink);
    border: 0;
    border-right: 1px solid var(--line);
    padding: 6px 14px;
    cursor: pointer;
  }
  .seg button:last-child {
    border-right: 0;
  }
  .seg button[aria-pressed='true'] {
    background: var(--accent);
    color: var(--surface);
  }
  button:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  select {
    font: inherit;
    font-size: 14px;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
  }
  .scroll {
    overflow-x: auto;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 14px;
  }
  th,
  td {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  th {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 500;
    white-space: nowrap;
  }
  td.num,
  th.num {
    text-align: right;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  tr.top td {
    background: var(--accent-soft);
  }
  .assump {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px 24px;
  }
  .assump div {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .assump .v {
    font-family: var(--mono);
    font-size: 16px;
  }
  .assump .why {
    font-size: 13px;
  }
  ul.plain {
    margin: 0;
    padding-left: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 72ch;
  }
  .note {
    font-size: 13px;
    color: var(--muted);
  }
  .abbr {
    font-family: var(--mono);
    font-weight: 600;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 1px 7px;
    border-radius: 4px;
  }
  .abbr.diff {
    background: var(--warn-soft);
    color: var(--warn);
  }
  .plan {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .groups {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .group {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .action {
    color: var(--ink);
  }
  .action b {
    color: var(--good);
  }
  details summary {
    cursor: pointer;
    color: var(--accent);
    font-size: 14px;
  }
  details[open] summary {
    margin-bottom: 8px;
  }
</style>

<main id="app"></main>

<script>
  const DATA = /*__DATA__*/ null
</script>
<script>
  const d = DATA
  const A = d.assumptions
  const OPT = {
    original: { label: 'Original', sub: 'Solo repuestos de calidad original (OEM).' },
    cheapest: {
      label: 'Más barato',
      sub: 'Lo más barato de cada repuesto, sea original o alternativo.',
    },
  }
  const FOCUS = String(A.focusMarginPct * 100)
  const state = { sev: 'todas', area: 'todas' }

  const supplier = (id) => d.suppliers.find((s) => s.id === id)
  const abbr = (id) => supplier(id)?.abbr ?? '?'
  const abbrByName = (name) => d.suppliers.find((s) => s.name === name)?.abbr ?? name
  const abbrs = (ids) => ids.map(abbr).join(' + ')
  const clp = (n) => 'CLP ' + Math.round(n).toLocaleString('es-CL')
  const mm = (n) => {
    const m = n / 1e6
    return (
      (m < 0 ? '−' : '') +
      'CLP ' +
      Math.abs(m).toLocaleString('es-CL', { maximumFractionDigits: 1 }) +
      ' M'
    )
  }
  const esc = (s) =>
    String(s ?? '').replace(
      /[&<>"]/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
    )
  const scen = (key) => d.scenarios.find((s) => s.key === key)
  const res = (key, opt, c) => scen(key).results[opt][c]
  // El plan de cada opción: el mejor proveedor solo, volando lo que conviene.
  const plan = (opt) => res('base', opt, 'B').single[0]

  function planCard(opt) {
    const r = res('base', opt, 'B')
    const p = plan(opt)
    const s = supplier(p.supplierIds[0])
    const pair = r.bestPerSize[1]
    const gain = pair ? pair.savingsClp[FOCUS] - p.savingsClp[FOCUS] : 0
    const price = (m) => Math.round((p.costClp * (10000 + m)) / 10000)
    const rows = A.marginsPct
      .map((m) => {
        const bp = String(m * 100)
        const pct = Math.round((p.savingsClp[bp] / p.baselineClp) * 100)
        return `<tr class="${bp === FOCUS ? 'top' : ''}"><td>${m} %</td><td class="num red">${mm(price(m * 100))}</td><td class="num red">${mm(p.savingsClp[bp])}</td><td class="num red">${pct} %</td></tr>`
      })
      .join('')
    return `<div class="card plan">
      <div class="eyebrow">Opción ${OPT[opt].label}</div>
      <div class="who"><span class="abbr">${esc(s.abbr)}</span> ${esc(s.name)}</div>
      <p class="muted">${OPT[opt].sub} Se compran ${p.covered} de los ${r.parts} repuestos que conviene volar; el cliente hoy paga ${mm(p.baselineClp)} por ellos. Nuestro costo puesto en Chile es ${mm(p.costClp)} con ${p.perSupplier[0].kg.toLocaleString('es-CL')} kg cobrables.</p>
      <div class="scroll"><table>
        <thead><tr><th>Margen sobre costo</th><th class="num">Precio al cliente</th><th class="num">Ahorro del cliente</th><th class="num">%</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <p class="note">Sumar un segundo proveedor (${esc(abbrs(pair.supplierIds))}) agregaría ${mm(gain)}: no compensa coordinar otro envío en una prueba.</p>
      <details><summary>Lista de compra (${p.items.length} repuestos)</summary>
        <div class="scroll"><table>
          <thead><tr><th>Repuesto</th><th>Calidad</th><th class="num">Cant.</th><th class="num">Costo en Chile</th><th class="num">Cliente hoy</th></tr></thead>
          <tbody>${[...p.items]
            .sort((a, b) => b.unitBaselineClp * b.qty - a.unitBaselineClp * a.qty)
            .map(
              (i) =>
                `<tr><td>${esc(i.name)}</td><td>${esc(i.quality)}</td><td class="num">${i.qty}</td><td class="num red">${clp(i.unitCostClp)}</td><td class="num">${clp(i.unitBaselineClp)}</td></tr>`,
            )
            .join('')}</tbody>
        </table></div>
      </details>
    </div>`
  }

  const SCEN_ES = {
    base: 'Con los datos actuales',
    rate_lo: 'El flete aéreo sale 30 % más barato',
    rate_hi: 'El flete aéreo sale 30 % más caro',
    vol_x2: 'Los bultos ocupan el doble de volumen',
    qty_25: 'Compramos solo 25 % de las cantidades',
    qty_10: 'Compramos solo 10 % de las cantidades',
  }
  function whatIf() {
    const cell = (s, opt) => {
      const b = s.results[opt].B.single[0]
      const same = b.supplierIds[0] === plan(opt).supplierIds[0]
      return `<td><span class="abbr ${same ? '' : 'diff'}">${esc(abbr(b.supplierIds[0]))}</span>${same ? '' : ' <span class="tag warn">cambia</span>'}</td><td class="num red">${mm(b.savingsClp[FOCUS])}</td>`
    }
    return `<div class="card scroll"><table>
      <thead><tr><th>Si…</th><th>Original</th><th class="num">Ahorro</th><th>Más barato</th><th class="num">Ahorro</th></tr></thead>
      <tbody>${d.scenarios.map((s) => `<tr><td>${esc(SCEN_ES[s.key] ?? s.labelEs)}</td>${cell(s, 'original')}${cell(s, 'cheapest')}</tr>`).join('')}</tbody>
    </table></div>`
  }

  function whichParts() {
    const rows = ['A', 'B', 'C']
      .map((c) => {
        const label = {
          A: `Volar todo (${A.topDemand ? d.partCount : ''} repuestos)`,
          B: 'Volar solo lo que conviene',
          C: `Volar solo los ${A.topDemand} de más demanda`,
        }[c]
        const cell = (opt) => {
          const r = res('base', opt, c)
          const x = plan(opt)
          const one = r.single.find((y) => y.supplierIds[0] === x.supplierIds[0])
          return `<td class="num">${r.parts}</td><td class="num red">${mm(one.savingsClp[FOCUS])}</td>`
        }
        return `<tr><td>${label}</td>${cell('original')}${cell('cheapest')}</tr>`
      })
      .join('')
    return `<div class="card scroll"><table>
      <thead><tr><th>Qué repuestos se compran</th><th class="num">Original: repuestos</th><th class="num">Ahorro</th><th class="num">Más barato: repuestos</th><th class="num">Ahorro</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`
  }

  function anomalyGroups() {
    const rows = d.anomalies.filter(
      (a) =>
        (state.sev === 'todas' || a.severity === state.sev) &&
        (state.area === 'todas' || a.area === state.area),
    )
    const groups = new Map()
    for (const a of rows) {
      const key = a.area + '|' + a.severity + '|' + a.titleEs.replace(/\d+/g, 'N')
      if (!groups.has(key)) groups.set(key, { first: a, items: [] })
      groups.get(key).items.push(a)
    }
    const cls = { alta: 'red', media: 'warn' }
    const list = [...groups.values()].sort(
      (x, y) =>
        (x.first.severity === 'alta' ? 0 : 1) - (y.first.severity === 'alta' ? 0 : 1) ||
        y.items.length - x.items.length,
    )
    return list
      .map(({ first, items }) => {
        const single = items.length === 1
        const title = single ? first.titleEs : first.titleEs.replace(/\d+/, 'N') + ''
        const inner = items
          .map((a) => {
            const who = [a.partName, a.supplier ? abbrByName(a.supplier) : '', a.quality]
              .filter(Boolean)
              .join(' · ')
            return `<li>${who ? `<strong>${esc(who)}</strong>: ` : ''}${esc(a.detailEs)}</li>`
          })
          .join('')
        return `<div class="card group">
          <div class="ghead"><span class="tag ${cls[first.severity] ?? ''}">${first.severity}</span> <span class="tag">${esc(first.area)}</span> <strong>${esc(single ? first.titleEs : title)}</strong>${single ? '' : ` <span class="muted">· ${items.length}</span>`}</div>
          ${first.actionEs ? `<p class="action"><b>Qué hacer:</b> ${esc(first.actionEs)}</p>` : ''}
          ${single ? `<p class="muted">${esc([first.partName, first.supplier ? abbrByName(first.supplier) : ''].filter(Boolean).join(' · '))}${first.partName || first.supplier ? ': ' : ''}${esc(first.detailEs)}</p>` : `<details><summary>Ver los ${items.length}</summary><ul class="plain">${inner}</ul></details>`}
        </div>`
      })
      .join('')
  }

  function render() {
    const html = `
    <header>
      <div class="eyebrow">Cliente inicial · ${esc(d.vehicle)} · ${new Date(d.generatedAt).toLocaleDateString('es-CL')}</div>
      <h1>Compra aérea de prueba: con qué proveedor quedarnos</h1>
      <p class="lede">Primera compra por avión, pagada por nosotros, sin usar el simulador de pedidos. El cliente elige entre <strong>Original</strong> y <strong>Más barato</strong>; para cada una hay un proveedor recomendado. Los montos son estimaciones con tarifas de referencia y van en rojo hasta que haya cotizaciones reales. Los márgenes se calculan sobre el costo puesto en Chile.</p>
      <p class="note">Proveedores: ${d.suppliers.map((s) => `<strong>${esc(s.abbr)}</strong> ${esc(s.name)}`).join(' · ')}</p>
    </header>

    <section>
      <h2>Recomendación</h2>
      <div class="verdict">${planCard('original')}${planCard('cheapest')}</div>
      <div class="card">
        <ul class="plain">
          <li><strong>Un solo proveedor por opción.</strong> Cada proveedor extra agrega unos US$ ${Math.round(A.perShipmentUsd)} de despacho, guía aérea y reparto, y otra guía que coordinar.</li>
          <li><strong>No se vuela todo.</strong> ${d.notWorthFlying} repuestos cuestan más puestos en Chile por avión que lo que paga hoy el cliente; quedan para una compra marítima.</li>
          <li><strong>GY queda fuera de Original</strong>: su cotización no dice la calidad de ninguna línea, es una estimación nuestra. Hasta que la confirme por escrito no se le compra como original.</li>
          <li>Se sacaron ${d.suspectOfferCount} ofertas con precio atípico (más de 3× o menos de 1/3 de la mediana). Un precio que parece error no debe decidir la compra.</li>
        </ul>
      </div>
    </section>

    <section>
      <h2>¿Qué repuestos volar?</h2>
      <p class="note">Ahorro del cliente con margen ${A.focusMarginPct} % sobre el costo en Chile, con el proveedor recomendado de cada opción.</p>
      ${whichParts()}
    </section>

    <section>
      <h2>¿Cambia la recomendación?</h2>
      <p class="note">Se recalcula cambiando un supuesto a la vez, solo con los repuestos que conviene volar. Si la sigla no cambia, la recomendación se mantiene.</p>
      ${whatIf()}
    </section>

    <section>
      <h2>Supuestos</h2>
      <div class="card assump">
        ${[
          [
            'Flete aéreo',
            'US$ ' +
              A.airUsdPerKg.toLocaleString('es-CL', { minimumFractionDigits: 2 }) +
              ' por kg',
            'referencia publicada, sin cotización de forwarder',
          ],
          [
            'Peso cobrable',
            'El mayor entre kg y cm³ ÷ ' + A.airDivisor.toLocaleString('es-CL'),
            'estándar IATA',
          ],
          [
            'Arancel',
            A.generalDutyPct + ' % general',
            'sin verificar contra Aduana; ningún proveedor confirmó Formulario F',
          ],
          [
            'Gastos por embarque',
            'US$ ' + Math.round(A.perShipmentUsd) + ' por proveedor',
            'despacho, guía aérea, manipulación y reparto: referencias públicas',
          ],
          [
            'Transporte en China',
            'Por distancia al aeropuerto',
            'distancias sin fuente; GY sin dato usa el promedio, ' +
              Math.round(A.averageAirportKm) +
              ' km',
          ],
          [
            'Tipo de cambio',
            'CLP ' + Math.round(d.fx.usdClp / 1e6) + ' por US$',
            'referencia del ' + d.fx.asOf,
          ],
          [
            'Peso y volumen',
            d.partCount + ' repuestos',
            'referencias de vendedores y piezas equivalentes, ninguno medido',
          ],
        ]
          .map(
            ([k, v, why]) =>
              `<div><span class="muted">${k}</span><span class="v red">${esc(v)}</span><span class="why muted">${esc(why)}</span></div>`,
          )
          .join('')}
      </div>
    </section>

    

    <section>
      <h2>Anomalías <span class="muted">(${d.anomalies.length})</span></h2>
      <div class="groups">${anomalyGroups()}</div>
    </section>

    <section>
      <h2>Datos que faltan</h2>
      <div class="card">
        <ul class="plain">${d.missingData.map((m) => `<li><strong>${esc(m.titleEs)}.</strong> ${esc(m.actionEs)}</li>`).join('')}
          <li><strong>Hoja MSDS del compresor.</strong> Pedirla y consultar al forwarder si puede ir por avión.</li>
        </ul>
      </div>
    </section>`
    document.getElementById('app').innerHTML = html
  }
  render()
</script>
